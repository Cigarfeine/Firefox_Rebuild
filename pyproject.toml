[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "firefox-rebuild"
version = "1.0.0"
description = "A friendly Firefox installer for lab environments — because manually updating 52 machines sucks"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Cigarfeine", email = "cigarfeine@example.com"}
]
maintainers = [
    {name = "Cigarfeine", email = "cigarfeine@example.com"}
]
keywords = [
    "firefox", "installer", "lab", "automation", "cli",
    "debian", "ubuntu", "mozilla", "browser", "deployment"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Software Distribution",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13.7.0",
    "typer>=0.9.0",
    "httpx>=0.26.0",
    "psutil>=5.9.0",
]
urls = [
    "Homepage = https://github.com/Cigarfeine/Firefox_Rebuild",
    "Repository = https://github.com/Cigarfeine/Firefox_Rebuild",
    "Issues = https://github.com/Cigarfeine/Firefox_Rebuild/issues",
    "Changelog = https://github.com/Cigarfeine/Firefox_Rebuild/blob/main/CHANGELOG.md",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
firefox-rebuild = "firefox_rebuild.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["src/firefox_rebuild"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]